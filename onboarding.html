<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monexa OS - Onboarding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_materi.css">
    <style>
        .onboarding-screen {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at 50% 50%, rgba(2, 7, 18, 0.55) 0%, rgba(1, 4, 10, 0.95) 100%), 
                        url('assets/hero-bg.jpg') no-repeat center center / cover;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .console-box {
            background: rgba(4, 12, 28, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            max-width: 700px;
            margin: auto;
        }
        .terminal-header {
            background: rgba(0, 240, 255, 0.05);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            font-family: var(--font-orbitron);
            letter-spacing: 1px;
            font-weight: 700;
        }
        .terminal-body {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            color: #34f5ff;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
            min-height: 250px;
            line-height: 1.6;
        }
        .input-line {
            display: flex;
            align-items: center;
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 6px;
            margin-top: 24px;
        }
        .input-line label {
            font-family: var(--font-orbitron);
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 0;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-right: 12px;
        }
        .console-input {
            background: transparent !important;
            border: none !important;
            color: #fff !important;
            font-family: var(--font-orbitron) !important;
            font-size: 1.1rem !important;
            letter-spacing: 1.5px;
            width: 100%;
            caret-color: #00f0ff;
        }
        .console-input:focus {
            outline: none !important;
            box-shadow: none !important;
        }
        .btn-launch-dive {
            background-color: var(--cyan-neon) !important;
            color: #020712 !important;
            font-family: var(--font-orbitron);
            font-weight: 800;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5) !important;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .btn-launch-dive:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8) !important;
        }
        .btn-launch-dive:disabled {
            background-color: rgba(0, 240, 255, 0.1) !important;
            border: 1px dashed rgba(0, 240, 255, 0.3) !important;
            color: rgba(255, 255, 255, 0.2) !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
        .cursor-blink {
            animation: cursor-blink-anim 0.8s infinite;
            font-weight: bold;
            color: #00f0ff;
        }
        @keyframes cursor-blink-anim {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <main class="onboarding-screen p-4 p-md-5">
        
        <div class="d-flex justify-content-between align-items-center w-100 mb-4">
            <div class="zone-indicator">
                <span class="text-secondary fw-semibold">MONEXA OS:</span> 
                <span class="text-cyan tracking-wider ms-1">SYSTEM BOOTSTRAP</span>
            </div>
            <div class="lumo-logo text-center">
                <img src="assets/lumo.png" alt="Lumo AI" class="logo-mini mb-1">
                <div class="logo-text">LUMO AI</div>
            </div>
        </div>

        <div class="container my-auto">
            <div class="console-box">
                <div class="terminal-header p-3 d-flex align-items-center">
                    <span class="badge bg-danger me-2" style="font-size: 0.55rem; animation: pulse-glow-red 1.5s infinite;">SYSTEM RAW FEED</span>
                    <span>MISSION_DESCENT_LOG.DAT</span>
                </div>
                <div class="p-4 p-md-5">
                    
                    <!-- Typewriter Text Container -->
                    <div class="terminal-body text-start" id="terminalLog">
                        <!-- Typewritten narrative goes here -->
                    </div>

                    <!-- Input Name Fields (visible once story ends or during) -->
                    <div class="input-line d-none" id="inputLine">
                        <label for="cadetNameInput">CADET_ID (NAMA):</label>
                        <input type="text" class="console-input" id="cadetNameInput" autocomplete="off" maxlength="15" placeholder="____">
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <button class="btn btn-launch-dive px-5 py-3 w-100 d-none" id="btnLaunchDescent" disabled>
                            MULAI PENYELAMAN (LAUNCH DESCENT)
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center w-100 mt-4 flex-wrap gap-2">
            <div class="text-secondary small">Monexa OS - Sequence 00-A</div>
            <div class="text-secondary small">SECURE LINK: MONEXA_OS_v4.2</div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const terminalLog = document.getElementById("terminalLog");
            const inputLine = document.getElementById("inputLine");
            const cadetNameInput = document.getElementById("cadetNameInput");
            const btnLaunch = document.getElementById("btnLaunchDescent");

            const narrativeLines = [
                "SISTEM PENDUKUNG HIDUP: OPERASIONAL 100%",
                "KEDALAMAN: 0 METER (PERMUKAAN LAUT BANDA)",
                "-------------------------------------------",
                "Tahun 2088. Bumi terhantam gejolak finansial tak terkendali.",
                "Kebocoran nilai dan manipulasi merusak struktur peradaban.",
                "Satu-satunya harapan terletak pada data logistik kognitif kuno",
                "yang tersimpan di palung terdalam: THE ABYSS.",
                "",
                "Kapal selam kognitif MONEXA OS siap diluncurkan untuk memetakan",
                "7 Zona Kedalaman dan mempelajari hukum pasar (IOSCO-OECD).",
                "",
                "Cadet, bersiaplah menghadapi bias psikologis dan badai pasar.",
                "Keutuhan lambung kapal selam sepenuhnya bergantung pada logikamu.",
                "Masukkan identitas Cadet untuk memulai sinkronisasi..."
            ];

            let lineIndex = 0;
            let charIndex = 0;
            let currentText = "";

            function typeWriter() {
                if (lineIndex < narrativeLines.length) {
                    const line = narrativeLines[lineIndex];
                    if (charIndex < line.length) {
                        currentText += line.charAt(charIndex);
                        terminalLog.innerHTML = currentText.replace(/\n/g, "<br>") + "<span class='cursor-blink'>_</span>";
                        charIndex++;
                        setTimeout(typeWriter, 12);
                    } else {
                        currentText += "<br>";
                        lineIndex++;
                        charIndex = 0;
                        setTimeout(typeWriter, 100);
                    }
                } else {
                    // Narrative typing complete, reveal inputs
                    terminalLog.innerHTML = currentText.replace(/\n/g, "<br>");
                    inputLine.classList.remove("d-none");
                    btnLaunch.classList.remove("d-none");
                    cadetNameInput.focus();
                }
            }

            // Start typewriter narrative
            setTimeout(typeWriter, 500);

            // Handle text input and Lanjut button
            cadetNameInput.addEventListener("input", () => {
                const val = cadetNameInput.value.trim();
                btnLaunch.disabled = val.length === 0;
            });

            // Enter key trigger click
            cadetNameInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter" && !btnLaunch.disabled) {
                    btnLaunch.click();
                }
            });

            btnLaunch.addEventListener("click", () => {
                const nameVal = cadetNameInput.value.trim();
                if (nameVal) {
                    localStorage.setItem("cadetName", nameVal);
                    // Add fade-out transition
                    document.body.style.opacity = 0;
                    document.body.style.transition = "opacity 0.6s ease";
                    setTimeout(() => {
                        window.location.href = "initial-assessment.html";
                    }, 600);
                }
            });
        });
    </script>
</body>
</html>
