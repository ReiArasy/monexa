<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monexa - Lumo AI Dialog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_materi.css">
</head>
<body>

    <main class="dialog-screen d-flex flex-column justify-content-between p-4 p-md-5">
        
        <div class="d-flex justify-content-between align-items-center w-100">
            <div class="zone-indicator">
                <span class="text-secondary fw-semibold">ZONE 1:</span> 
                <span class="text-cyan tracking-wider ms-1">THE SHALLOW</span>
            </div>
            <div class="position-relative">
                <div class="lumo-logo text-center" id="lumoChatTrigger" style="cursor: pointer;">
                    <img src="assets/lumo.png" alt="Lumo AI" class="logo-mini mb-1">
                    <div class="logo-text">LUMO AI</div>
                    <span class="badge bg-danger position-absolute translate-middle rounded-pill p-1" id="chatBadge" style="font-size: 0.5rem; top: 5px; right: -5px;">1</span>
                </div>
                
                <!-- Lumo Sidebar Chatbot -->
                <div class="lumo-sidebar-chat" id="lumoFloatingChat" style="position: fixed; top: 0; right: 0; width: 400px; height: 100vh; background: rgba(3, 10, 24, 0.95); border-left: 2.5px solid rgba(0, 240, 255, 0.25); z-index: 2000; box-shadow: -10px 0 35px rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;">
                    <div class="chat-header d-flex justify-content-between align-items-center p-3 border-bottom border-secondary border-opacity-20" style="background: rgba(0, 240, 255, 0.05);">
                        <span class="font-orbitron text-cyan fs-6 fw-bold"><i class="bi bi-robot me-2"></i>LUMO CORE v1.2</span>
                        <button type="button" class="btn-close btn-close-white" id="closeLumoChat"></button>
                    </div>
                    <div class="chat-messages p-4 text-start flex-grow-1" id="chatMessages" style="overflow-y: auto; font-family: var(--font-inter); font-size: 0.9rem; line-height: 1.6;">
                        <div class="chat-bubble mb-3 p-3 rounded" style="background: rgba(0, 240, 255, 0.04); border: 1px solid rgba(0, 240, 255, 0.12);">
                            <span class="small text-cyan font-orbitron d-block mb-1">LUMO AI</span>
                            Selamat datang di deck utama, Cadet! Aku siap membantumu memahami hukum pasar (IOSCO OECD). Apa yang sedang mengganjal logikamu?
                        </div>
                    </div>
                    <div class="chat-input-options p-3 border-top border-secondary border-opacity-20 d-flex flex-column gap-2 text-start" id="chatInputOptions" style="background: rgba(4, 12, 28, 0.4);">
                        <button class="btn btn-outline-cyan btn-sm text-start q-btn" style="font-size: 0.8rem;" data-q="area1">Apa itu IOSCO Area 1?</button>
                        <button class="btn btn-outline-cyan btn-sm text-start q-btn" style="font-size: 0.8rem;" data-q="area5">Apa hak investor (Area 5)?</button>
                        <button class="btn btn-outline-cyan btn-sm text-start q-btn" style="font-size: 0.8rem;" data-q="area7">Bagaimana menghindari scam (Area 7)?</button>
                    </div>
                    <!-- Custom Input Message Box -->
                    <div class="p-3 border-top border-secondary border-opacity-20 d-flex gap-2" style="background: rgba(2, 6, 16, 0.9);">
                        <input type="text" class="form-control text-light" id="lumoCustomInput" placeholder="Tanyakan ke Lumo..." style="background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 240, 255, 0.2); font-size: 0.9rem; color: #fff;">
                        <button class="btn btn-cyan px-3" id="btnSendLumoMessage" style="font-family: var(--font-orbitron); font-weight: 700; font-size: 0.85rem;">KIRIM</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container my-auto container-layout">
            <div class="row align-items-center justify-content-center">
                
                <div class="col-lg-5 text-center text-lg-start position-relative z-2 mb-4 mb-lg-0">
                    <img src="assets/lumo.png" alt="Lumo Character" class="img-fluid character-jelly floating-anim">
                </div>

                <div class="col-lg-7 position-relative z-2">
                    <div class="speech-bubble p-4 p-md-5">
                        <div class="bubble-tag mb-4">
                            <span class="tag-line"></span> LUMO
                        </div>
                        
                        <h2 class="bubble-title fw-bold text-cyan mb-3" id="typingTitle"></h2>
                        
                        <p class="bubble-desc text-secondary leading-relaxed mb-0" id="typingDesc"></p>
                    </div>
                </div>

            </div>
        </div>

        <div class="d-flex justify-content-end w-100">
            <button class="btn btn-continue tracking-widest fw-bold px-4 py-2" id="btnContinue">
                CONTINUE
            </button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
